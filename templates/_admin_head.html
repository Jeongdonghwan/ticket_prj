<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{--yellow:#2F7BFF;--deep:#1A5CE6;--ink:#191919;--soft:#767676;--bg:#F3F6FB;--line:#DFE6F0;--green:#12B76A;--red:#E5484D}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"Pretendard Variable",Pretendard,sans-serif;background:var(--bg);color:var(--ink);font-size:14.5px;letter-spacing:-0.01em}
header{background:var(--ink);color:#fff;padding:0 24px;height:56px;display:flex;align-items:center;justify-content:space-between}
.logo{font-weight:800;font-size:16px;display:flex;gap:8px;align-items:center}
.logo i{width:24px;height:17px;background:var(--yellow);border-radius:4px}
header a{color:#B8B4AA;font-size:13px;font-weight:700;text-decoration:none}
header nav{display:flex;gap:18px}
main{max-width:1080px;margin:0 auto;padding:28px 20px 60px}
h1{font-size:20px;font-weight:800}
.sub{color:var(--soft);font-size:13px;margin:4px 0 20px}
.panel{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th{font-size:12.5px;color:var(--soft);text-align:left;padding:12px;border-bottom:1px solid var(--line);font-weight:700;background:#FCFAF3}
td{padding:13px 12px;border-bottom:1px solid #F1EEE4;font-weight:600;vertical-align:middle}
tr:last-child td{border-bottom:0}
.src{display:inline-block;font-size:11.5px;font-weight:800;padding:3px 9px;border-radius:999px;background:#F1EEE4;color:var(--soft)}
.src.pub{background:#E3F8EE;color:var(--green)}
.btn{display:inline-block;border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 14px;font-family:inherit;font-weight:800;font-size:13px;cursor:pointer;color:var(--ink);text-decoration:none}
.btn.pri{background:var(--yellow);color:#fff;border-color:var(--yellow)}
.btn.del{color:var(--red)}
.empty{padding:36px;text-align:center;color:var(--soft);font-weight:600}
.err{background:#FDECEC;color:var(--red);padding:10px 14px;border-radius:10px;font-weight:700;margin-bottom:14px}
@media(max-width:760px){.hide-m{display:none}}
</style>
