<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>알뜰티켓 어드민 — 로그인</title>
<meta name="robots" content="noindex,nofollow">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{--yellow:#FFC933;--deep:#F2A900;--ink:#191919;--soft:#767676;--bg:#F6F4EE;--line:#E6E1D4;--red:#E5484D}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"Pretendard Variable",Pretendard,sans-serif;background:var(--bg);color:var(--ink);font-size:14.5px;letter-spacing:-0.01em;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:36px 32px;width:340px}
.logo{font-weight:800;font-size:17px;display:flex;gap:8px;align-items:center;justify-content:center;margin-bottom:26px}
.logo i{width:24px;height:17px;background:var(--yellow);border-radius:4px}
label{display:grid;gap:6px;font-size:12.5px;font-weight:800;color:var(--soft);margin-top:14px}
input{border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-family:inherit;font-size:14px}
input:focus{border-color:var(--yellow);outline:none}
button{margin-top:22px;width:100%;background:var(--ink);color:var(--yellow);border:0;border-radius:10px;padding:12px;font-family:inherit;font-size:14px;font-weight:800;cursor:pointer}
.err{margin-top:14px;color:var(--red);font-size:12.5px;font-weight:700;text-align:center}
</style>
</head>
<body>
<form class="card" method="post">
  <div class="logo"><i></i>알뜰티켓 어드민</div>
  <label>아이디<input name="username" required autofocus autocomplete="username"></label>
  <label>비밀번호<input name="password" type="password" required autocomplete="current-password"></label>
  <button type="submit">로그인</button>
  {% if error %}<p class="err">{{ error }}</p>{% endif %}
</form>
</body>
</html>
